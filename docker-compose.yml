services:
  redis:
    image: "redis:7-alpine"
    restart: unless-stopped
    command: redis-server --appendonly yes

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./backend/databasemigration/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/databasemigration/001_add_owner_user_id.sql:/docker-entrypoint-initdb.d/z_add_owner_user_id.sql
      - ./backend/databasemigration/002_add_hod_role.sql:/docker-entrypoint-initdb.d/zz_002_add_hod_role.sql
      - ./backend/databasemigration/003_allow_duplicate_student_regn.sql:/docker-entrypoint-initdb.d/zz_003_allow_duplicate_student_regn.sql
      - ./backend/databasemigration:/migrations
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classassign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or shell}
      POSTGRES_DB: ${POSTGRES_DB:-classassign}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node server.js
    volumes:
      - ./backend:/app
      - ./format:/app/format
      - /app/node_modules
      - app_uploads:/app/uploads
    ports:
      - "${BACKEND_HOST_PORT:-5002}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      POSTGRES_USER: ${POSTGRES_USER:-classassign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-classassign}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-https://iexam.kumaraguru.in}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://iexam.kumaraguru.in,http://213.210.37.189:3002,http://213.210.37.189:5002}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://iexam.kumaraguru.in,http://213.210.37.189:3002,http://213.210.37.189:5002}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://iexam.kumaraguru.in}
      USE_HTTPS: ${USE_HTTPS:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.office365.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-support.iexam@kct.ac.in}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Hallora Examination Cell <support.iexam@kct.ac.in>}
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node config/worker.js
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      POSTGRES_USER: ${POSTGRES_USER:-classassign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-classassign}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      KCT_TEAMS_API_URL: ${KCT_TEAMS_API_URL:-}
      KCT_TEAMS_FROM_EMAIL: ${KCT_TEAMS_FROM_EMAIL:-}
      KCT_TEAMS_API_USER: ${KCT_TEAMS_API_USER:-}
      KCT_TEAMS_API_PASSWORD: ${KCT_TEAMS_API_PASSWORD:-}
      MOCK_TEAMS_API: ${MOCK_TEAMS_API:-false}
      BULL_CONCURRENCY: ${BULL_CONCURRENCY:-1}
      BULL_MAX_RETRIES: ${BULL_MAX_RETRIES:-5}
      INSTITUTION_TIMEZONE: ${INSTITUTION_TIMEZONE:-Asia/Kolkata}
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  flower:
    profiles: ["dev"]
    image: deadly0/bull-board:latest
    ports:
      - "3001:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - worker

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${FRONTEND_HOST_PORT:-3002}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  app_uploads:
