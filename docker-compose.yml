services:
  # 1. Redis Service
  redis:
    image: "redis:alpine"

  # 2. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./backend/databasemigration/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/databasemigration/001_add_owner_user_id.sql:/docker-entrypoint-initdb.d/z_add_owner_user_id.sql
      - ./backend/databasemigration/002_add_hod_role.sql:/docker-entrypoint-initdb.d/zz_002_add_hod_role.sql
      - ./backend/databasemigration:/migrations
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"

  # 3. Backend (Express / Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node server.js
    volumes:
      - ./backend:/app
      - ./format:/app/format
      - /app/node_modules
      - app_uploads:/app/uploads
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - db

  # 4. Bull Worker Service
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node config/bullWorker.js
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - db

  # 5. Bull Board (queue monitor — Flower equivalent for Bull)
  flower:
    image: deadly0/bull-board:latest
    ports:
      - "3001:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - worker

  # 6. Frontend (React / Vite — served via Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  app_uploads: