services:
  redis:
    image: "redis:7-alpine"
    restart: unless-stopped
    command: redis-server --appendonly yes

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./backend/databasemigration/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/databasemigration/001_add_owner_user_id.sql:/docker-entrypoint-initdb.d/z_add_owner_user_id.sql
      - ./backend/databasemigration/002_add_hod_role.sql:/docker-entrypoint-initdb.d/zz_002_add_hod_role.sql
      - ./backend/databasemigration/003_allow_duplicate_student_regn.sql:/docker-entrypoint-initdb.d/zz_003_allow_duplicate_student_regn.sql
      - ./backend/databasemigration:/migrations
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classassign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or shell}
      POSTGRES_DB: ${POSTGRES_DB:-classassign}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node server.js
    volumes:
      - ./backend:/app
      - ./format:/app/format
      - /app/node_modules
      - app_uploads:/app/uploads
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      POSTGRES_USER: ${POSTGRES_USER:-classassign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-classassign}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      FRONTEND_URL: http://${API_HOST:-10.1.150.51}:${FRONTEND_PORT:-5173}
      CORS_ORIGINS: http://${API_HOST:-10.1.150.51}:${FRONTEND_PORT:-5173}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node config/bullWorker.js
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      POSTGRES_USER: ${POSTGRES_USER:-classassign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-classassign}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  flower:
    profiles: ["dev"]
    image: deadly0/bull-board:latest
    ports:
      - "3001:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - worker

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  app_uploads:
